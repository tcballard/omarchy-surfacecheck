[workspace]
members = [
    "crates/surfacecheck-core",
    "crates/surfacecheck-capture",
    "crates/surfacecheck-store",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
flate2 = "1.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10"
